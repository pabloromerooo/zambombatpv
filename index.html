<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Solera">
<title>Solera TPV</title>
<style>
:root{--bg:#09090a;--s1:#121110;--s2:#181716;--s3:#211f1d;--line:#262321;--line2:#37332f;--tx:#f3eee6;--mut:#8f8981;--mut2:#615c56;
--gold:#c9a36a;--ok:#3fbf8b;--okd:#03150e;--amb:#f2a33a;--red:#ff5c5c;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif;
--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:var(--bg);background-image:radial-gradient(900px 420px at 50% -8%,rgba(201,163,106,.09),transparent 70%);background-attachment:fixed}
html,body{margin:0;height:100%;color:var(--tx);font-family:"SF Pro Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
body{background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer;padding:0}
textarea,input{-webkit-user-select:text;user-select:text;font:inherit;color:var(--tx)}
svg{display:block}
h2{margin:0 0 12px;font-size:21px;font-weight:650;letter-spacing:-.01em}
h3{margin:20px 0 8px;font-size:11px;color:var(--mut);letter-spacing:.16em;font-weight:600}
.hint{color:var(--mut);font-size:14px;line-height:1.5;margin:6px 0 14px}
.btn{min-height:50px;padding:0 18px;border-radius:13px;background:var(--s3);font-weight:600;font-size:15px;border:1px solid var(--line2);transition:transform .12s var(--ease),background .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ok);color:var(--okd);border-color:var(--ok)}
.btn.red{background:rgba(255,92,92,.1);color:#ff8f8f;border-color:rgba(255,92,92,.35)}
.btn.full{width:100%;margin-top:8px}
.r{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.r .btn{flex:1}

/* marca */
.brand{display:flex;align-items:baseline;gap:12px}
.brand b{font-family:var(--serif);font-weight:500;letter-spacing:.01em;font-size:25px;color:var(--tx);line-height:1}
.brand small{font-size:10px;letter-spacing:.24em;font-weight:600;color:var(--gold)}

/* selector de modo */
.picker{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px;max-width:560px;margin:0 auto}
.picker .logo{font-family:var(--serif);font-size:64px;font-weight:500;letter-spacing:-.01em;line-height:1;margin:0 0 10px}
.picker .by{font-size:11.5px;letter-spacing:.26em;color:var(--gold);font-weight:600;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line2)}
.pbtn{display:flex;align-items:center;gap:18px;padding:22px 22px;border-radius:20px;background:var(--s1);border:1px solid var(--line2);text-align:left;transition:transform .15s var(--ease),border-color .2s}
.pbtn:active{transform:scale(.98);border-color:var(--gold)}
.pbtn .pi{width:56px;height:56px;border-radius:16px;background:var(--s3);display:grid;place-items:center;color:var(--gold);flex:0 0 auto}
.pbtn strong{display:block;font-size:20px;letter-spacing:.14em;font-weight:650}
.pbtn small{display:block;color:var(--mut);font-size:14px;margin-top:3px;font-weight:400}

/* barra */
.top{position:sticky;top:0;z-index:5;background:rgba(9,9,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:calc(env(safe-area-inset-top) + 8px) 12px 6px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:10px}
.pill{margin-left:auto;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;font-weight:600;font-size:12.5px;letter-spacing:.03em;background:var(--s2);border:1px solid var(--line2);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.pill.ok{color:var(--ok)}.pill.ok{color:#9be8c6}.pill.ok::before{color:var(--ok)}
.pill.off{color:var(--amb)}.pill.off::before{animation:blink 1.6s infinite}
.ico{width:46px;height:46px;border-radius:13px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--tx)}
.ico:active{background:var(--s3)}
.waiters{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.waiters::-webkit-scrollbar{display:none}
.waiters .lbl{flex:0 0 auto;align-self:center;font-size:9.5px;color:var(--mut);font-weight:600;letter-spacing:.16em;line-height:1.2;text-align:center;padding-right:2px}
.wchip{flex:0 0 auto;min-width:48px;height:48px;border-radius:13px;background:var(--s2);border:1px solid var(--line);font-weight:600;font-size:19px;padding:0 12px;color:var(--mut);transition:background .15s,color .15s}
.wchip.sel{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.wchip.kb{color:var(--tx);display:grid;place-items:center}
.shake{animation:shake .4s}
.cats{display:flex;gap:6px;margin:6px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:1 0 auto;height:52px;padding:0 20px;font-weight:600;font-size:15.5px;color:var(--mut);letter-spacing:.02em;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.cat.sel{color:var(--tx);border-bottom-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:8px 12px calc(180px + env(safe-area-inset-bottom))}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.prod{position:relative;min-height:112px;border-radius:18px;background:linear-gradient(180deg,#1b1a19,#131211);border:1px solid var(--line);padding:16px 14px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;overflow:hidden;transition:transform .1s var(--ease),border-color .15s,background .15s}
.prod::before{content:"";position:absolute;left:14px;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.prod:active{transform:scale(.965);background:#242220}
.prod .pn{font-size:19.5px;font-weight:580;line-height:1.15;letter-spacing:-.01em;padding-right:58px}
.prod .pp{font-size:15px;color:var(--mut);font-weight:500}
.prod.has{border-color:rgba(63,191,139,.55);background:linear-gradient(180deg,#12211a,#0d1813)}
.prod.flash{animation:flash .28s}
.badge{position:absolute;top:12px;right:12px;min-width:46px;height:34px;padding:0 12px;border-radius:99px;background:var(--ok);color:var(--okd);font-size:19px;font-weight:700;display:none;align-items:center;justify-content:center}
.has .badge{display:flex}
.badge.bump{animation:bump .22s}
.minus{position:absolute;right:8px;bottom:8px;width:44px;height:40px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line2);color:var(--tx);font-size:24px;font-weight:500;display:none;align-items:center;justify-content:center}
.has .minus{display:flex}
.fly{position:absolute;left:50%;top:42%;font-size:30px;font-weight:700;color:var(--ok);pointer-events:none;animation:fly .55s forwards}
.dock{position:fixed;left:0;right:0;bottom:0;padding:30px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(9,9,10,0),var(--bg) 38%);z-index:6}
.sum{display:flex;gap:8px;align-items:center;margin-bottom:8px;min-height:34px}
.sum .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:var(--mut);font-weight:500}
.sum button{padding:8px 14px;border-radius:10px;background:var(--s2);border:1px solid var(--line2);font-weight:600;font-size:11.5px;letter-spacing:.12em;color:#ff9b9b}
.send{width:100%;height:74px;border-radius:19px;background:linear-gradient(180deg,#52d3a3,#2da676);color:var(--okd);font-size:20px;font-weight:700;letter-spacing:.015em;box-shadow:0 14px 34px -10px rgba(63,191,139,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .1s var(--ease)}
.send:active{transform:scale(.985)}
.send[disabled]{background:var(--s2);color:var(--mut2);box-shadow:none;font-size:15px;font-weight:500;border:1px solid var(--line)}

/* cocina */
.kh{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 12px) 20px 12px;background:rgba(9,9,10,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.kh .brand b{font-size:30px}.kh .brand small{font-size:12px}
.kh .cnt{font-size:15px;font-weight:600;letter-spacing:.06em;color:var(--tx);background:var(--s2);border:1px solid var(--line2);border-radius:99px;padding:10px 18px}
.kh .sp{flex:1}
.kh .ico{width:52px;height:52px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:18px 20px;align-items:start}
.card{position:relative;background:var(--s1);border:1px solid var(--line2);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;animation:cin .45s var(--ease);transition:opacity .28s,transform .28s}
.card::before{content:"";height:6px;background:var(--line2);transition:background .3s}
.card.out{opacity:0;transform:scale(.92) translateY(-8px);pointer-events:none}
.card.warn{border-color:rgba(242,163,58,.6)}.card.warn::before{background:var(--amb)}
.card.crit{border-color:rgba(255,92,92,.7);animation:pulse 1.2s infinite}.card.crit::before{background:var(--red)}
.card.fresh{box-shadow:0 0 0 2px var(--ok),0 0 44px rgba(63,191,139,.35)}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line)}
.num{font-size:60px;font-weight:700;line-height:1;letter-spacing:-.035em}
.chr{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.wtag{font-size:16px;font-weight:700;letter-spacing:.08em;padding:6px 12px;border-radius:9px;background:var(--wc);color:#14110a;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;color:var(--tx)}
.warn .tm{color:var(--amb)}.crit .tm{color:var(--red)}
.li{list-style:none;margin:0;padding:16px 18px 18px;font-size:30px;font-weight:650;line-height:1.15;display:flex;flex-direction:column;gap:10px;letter-spacing:-.01em}
.li b{color:var(--gold);display:inline-block;min-width:2.2ch;font-weight:700}
.done{height:88px;background:var(--ok);color:var(--okd);font-size:21px;font-weight:700;letter-spacing:.12em;transition:background .15s}
.done:active{background:#2da676}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:90px 10px;font-size:22px;font-weight:500;letter-spacing:.02em}
.empty b{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:1px solid var(--line2);color:var(--ok)}
.empty svg{width:36px;height:36px}

/* modales / avisos */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--s1);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s var(--ease)}
.sheet.wide{max-width:680px}
@media(min-width:720px){.ovl{align-items:center}.sheet{border-radius:24px}}
.sheet>.x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.sheet h2{padding-right:50px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:0 16px;border-radius:14px;background:var(--s2);border:1px solid var(--line);margin-bottom:8px;font-size:16.5px;font-weight:550;text-align:left}
.mrow i{font-style:normal;color:var(--gold);display:grid;place-items:center}
.mrow.red{color:#ff9b9b}.mrow.red i{color:#ff9b9b}
textarea.code{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:none;word-break:break-all}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--mut);margin:12px 0 5px}
.slot{border:1px solid var(--line2);border-radius:16px;padding:14px;margin:10px 0;background:var(--bg)}
.slt{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}.st{color:var(--amb);font-size:13px;font-weight:600}.st.ok{color:var(--ok)}.st.bad{color:var(--red)}
.rep{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;overflow:auto;max-height:50vh;white-space:pre;-webkit-user-select:text;user-select:text}
.wv{width:100%;height:64px;border-radius:14px;background:var(--bg);border:1.5px solid var(--gold);text-align:center;font-size:30px;font-weight:650;margin-bottom:10px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:66px;border-radius:15px;background:var(--s3);border:1px solid var(--line2);font-size:26px;font-weight:550}
.pad button:active{background:var(--line2)}
.pad .okk{background:var(--ok);color:var(--okd);border-color:var(--ok)}.pad .alt{color:#ff9b9b}
.hrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hrow .n{font-weight:700;font-size:19px;min-width:62px}.hrow .d{flex:1;font-size:14px;color:var(--mut);line-height:1.4}.hrow .s{font-size:12px;font-weight:700;letter-spacing:.08em;white-space:nowrap}
.s.q{color:var(--amb)}.s.k{color:#8ecae6}.s.d{color:var(--ok)}
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);z-index:99;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:none;display:flex;align-items:center;gap:12px;background:rgba(24,24,27,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:550;max-width:94%;animation:down .28s var(--ease);box-shadow:0 14px 40px rgba(0,0,0,.7)}
.toast.ok{border-color:rgba(63,191,139,.5);color:#9be8c6}.toast.warn{border-color:rgba(242,163,58,.5);color:var(--amb)}.toast.bad{border-color:rgba(255,92,92,.5);color:#ff9b9b}
.toast button{pointer-events:auto;background:var(--s3);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;font-weight:700;font-size:12px;letter-spacing:.1em;color:var(--tx)}
.toast.x{opacity:0;transform:translateY(-10px);transition:.3s}

@keyframes blink{50%{opacity:.35}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes flash{0%{background:#1d3a2c}100%{}}
@keyframes fly{to{transform:translateY(-56px);opacity:0}}
@keyframes cin{from{transform:translateY(-18px) scale(.96);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,92,92,.45)}}
@keyframes up{from{transform:translateY(36px);opacity:0}}
@keyframes down{from{transform:translateY(-16px);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>
<body>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<div id="app"></div>
<div id="toasts"></div>

<script>
(()=>{
'use strict';

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR=new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(n);
const cents=n=>Math.round(n*100);
const pad=(n,l=3)=>String(n).padStart(l,'0');
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const fmtDT=ts=>new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const stamp=()=>{const d=new Date(),p=n=>pad(n,2);return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`};
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch{}};

const hashRole=location.hash.replace('#','');
const ROLE=['barra','cocina'].includes(hashRole)?hashRole:(['barra','cocina'].includes(store.get('zmb.role'))?store.get('zmb.role'):'');
const DEV=store.get('zmb.dev')||(()=>{const d=Math.random().toString(36).slice(2,6);store.set('zmb.dev',d);return d})();
const ALIVE_MS=9000;
const BRAND='Solera';
const ic=(d,z=24)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON={
 menu:ic('<path d="M4 7h16M4 12h16M4 17h16"/>'),
 kb:ic('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>'),
 bell:ic('<path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>'),
 bellOff:ic('<path d="M6 16v-5a6 6 0 0 1 .8-3M18 11v5l1.5 2H8M10 21h4M4 4l16 16"/>'),
 undo:ic('<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
 cash:ic('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
 receipt:ic('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
 wifi:ic('<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/>'),
 edit:ic('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
 swap:ic('<path d="M7 7h12l-3-3M17 17H5l3 3"/>'),
 trash:ic('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),
 check:ic('<path d="M5 12.5l4.5 4.5L19 7.5"/>',36),
 x:ic('<path d="M6 6l12 12M18 6L6 18"/>',20),
 glass:ic('<path d="M6 4h12l-1.5 16h-9z"/><path d="M6.7 9h10.6"/>',28),
 flame:ic('<path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 .3 1.2 1 2 2 2 0-3-1-5 1-8z"/>',28)
};

/* ---------- toasts ---------- */
function toast(html,o={}){
  const t=document.createElement('div');t.className='toast '+(o.kind||'');
  t.innerHTML=`<span>${html}</span>`;
  if(o.action){const b=document.createElement('button');b.textContent=o.action[0];b.onclick=()=>{o.action[1]();t.remove()};t.append(b)}
  $('#toasts').append(t);
  setTimeout(()=>{t.classList.add('x');setTimeout(()=>t.remove(),320)},o.ms||2200);
}

/* ---------- modal ---------- */
function modal(html,cls=''){
  const o=document.createElement('div');o.className='ovl';
  o.innerHTML=`<div class="sheet ${cls}"><button class="x" aria-label="Cerrar">${ICON.x}</button>${html}</div>`;
  document.body.append(o);
  o.close=()=>{o.remove();o.onclose&&o.onclose()};
  $('.x',o).onclick=o.close;
  o.addEventListener('click',e=>{if(e.target===o)o.close()});
  return o;
}
function confirmBox(msg,yesLabel,onYes){
  const m=modal(`<h2>¿Seguro?</h2><p class="hint" style="font-size:16px">${msg}</p><div class="r"><button class="btn" data-n>Cancelar</button><button class="btn red" data-y>${yesLabel}</button></div>`);
  $('[data-n]',m).onclick=m.close;$('[data-y]',m).onclick=()=>{m.close();onYes()};
}

/* ---------- audio (aviso metálico) ---------- */
let actx=null,soundOn=store.get('zmb.sound',true);
function audio(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch{}}
  if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
  return actx;
}
addEventListener('pointerdown',audio,{passive:true});
function tone(f,t0,dur,type,vol){
  const c=audio();if(!c)return;const T=c.currentTime+t0;
  const o=c.createOscillator(),g=c.createGain(),hp=c.createBiquadFilter();
  hp.type='highpass';hp.frequency.value=600;o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol,T+.006);g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  o.connect(hp);hp.connect(g);g.connect(c.destination);o.start(T);o.stop(T+dur+.03);
}
function ringNew(){ // pitido metálico: dos golpes + parcial inarmónico
  if(!soundOn)return;
  tone(1760,0,.14,'square',.22);tone(2790,0,.1,'square',.08);
  tone(1318,.15,.14,'square',.22);tone(2100,.15,.1,'square',.08);
  tone(1760,.3,.34,'triangle',.3);
  buzz([140,60,140]);
}
function chimeReady(){tone(988,0,.12,'sine',.3);tone(1480,.12,.22,'sine',.3);buzz([90,50,90])}

/* =====================================================================
   BASE DE DATOS LOCAL (IndexedDB, con reserva en localStorage)
   ===================================================================== */
const DB=(()=>{
  const NAME='zmb-'+ROLE;let db=null,ls=false;const mem=new Map();
  return{
    init(){return new Promise(res=>{
      try{
        const r=indexedDB.open(NAME,1);
        r.onupgradeneeded=()=>r.result.createObjectStore('o',{keyPath:'id'});
        r.onsuccess=()=>{db=r.result;res()};
        r.onerror=r.onblocked=()=>{ls=true;res()};
      }catch{ls=true;res()}
    }).then(()=>{if(ls)store.get(NAME,[]).forEach(o=>mem.set(o.id,o))})},
    all(){return new Promise(res=>{
      if(ls)return res([...mem.values()]);
      const q=db.transaction('o').objectStore('o').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([]);
    })},
    put(o){return new Promise(res=>{
      if(ls){mem.set(o.id,o);store.set(NAME,[...mem.values()]);return res()}
      try{const t=db.transaction('o','readwrite');t.objectStore('o').put(o);t.oncomplete=()=>res();t.onerror=()=>res()}catch{res()}
    })},
    clear(){return new Promise(res=>{
      if(ls){mem.clear();store.set(NAME,[]);return res()}
      const t=db.transaction('o','readwrite');t.objectStore('o').clear();t.oncomplete=()=>res();t.onerror=()=>res();
    })}
  };
})();

/* =====================================================================
   RED LOCAL: WebRTC DataChannels (Wi-Fi sin internet) + BroadcastChannel
   El "emparejamiento" se hace una vez con dos códigos de texto
   (no hay servidor de señalización). Después todo va por la LAN.
   ===================================================================== */
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pipe(u8,S,fmt){const s=new S(fmt);const w=s.writable.getWriter();w.write(u8).catch(()=>{});w.close().catch(()=>{});return new Uint8Array(await new Response(s.readable).arrayBuffer())}
async function encDesc(d){
  const u8=new TextEncoder().encode(JSON.stringify({type:d.type,sdp:d.sdp}));
  return window.CompressionStream?'Z'+b64(await pipe(u8,CompressionStream,'deflate-raw')):'R'+b64(u8);
}
async function decDesc(code){
  try{
    code=code.replace(/\s+/g,'');if(!code)throw 0;
    let u8=unb64(code.slice(1));
    if(code[0]==='Z'){if(!window.DecompressionStream)throw new Error('Navegador demasiado antiguo para leer el código');u8=await pipe(u8,DecompressionStream,'deflate-raw')}
    else if(code[0]!=='R')throw 0;
    return JSON.parse(new TextDecoder().decode(u8));
  }catch(e){throw new Error(e&&e.message?e.message:'Código no válido o incompleto')}
}
const waitIce=(pc,ms=2500)=>new Promise(res=>{
  if(pc.iceGatheringState==='complete')return res();
  const fin=()=>{clearTimeout(t);pc.removeEventListener('icegatheringstatechange',chk);res()};
  const chk=()=>{if(pc.iceGatheringState==='complete')fin()};
  const t=setTimeout(fin,ms);pc.addEventListener('icegatheringstatechange',chk);
});
async function copyText(txt,ta){

}

const Net={
  peers:new Map(),bc:null,onMsg:null,seq:0,
  init(onMsg){
    this.onMsg=onMsg;
    if('BroadcastChannel' in window){
      try{
        this.bc=new BroadcastChannel('zmb-v1');
        this.bc.onmessage=e=>{const m=e.data;if(!m||m.src===ROLE)return;onMsg(m,r=>{r.src=ROLE;try{this.bc.postMessage(r)}catch{}})};
      }catch{}
    }
  },
  send(m){
    m.src=ROLE;const s=JSON.stringify(m);
    this.peers.forEach(p=>{if(p.dc&&p.dc.readyState==='open'){try{p.dc.send(s)}catch{}}});
    if(this.bc){try{this.bc.postMessage(m)}catch{}}
  },
  mkPeer(){
    const pc=new RTCPeerConnection({iceServers:[]}); // sin STUN: solo red local
    const p={id:'p'+(++this.seq),pc,dc:null,onopen:null,onfail:null};
    pc.onconnectionstatechange=()=>{
      if(['failed','closed'].includes(pc.connectionState)){this.drop(p);p.onfail&&p.onfail()}
    };
    return p;
  },
  wire(p,dc){
    p.dc=dc;
    dc.onopen=()=>{p.onopen&&p.onopen()};
    dc.onclose=()=>{this.drop(p);p.onfail&&p.onfail()};
    dc.onmessage=e=>{
      let m;try{m=JSON.parse(e.data)}catch{return}
      this.onMsg(m,r=>{r.src=ROLE;try{dc.send(JSON.stringify(r))}catch{}});
    };
  },
  drop(p){try{p.pc.close()}catch{};this.peers.delete(p.id)},
  /* anfitrión (cocina): crea oferta -> código A */
  async hostOffer(){
    const p=this.mkPeer();this.wire(p,p.pc.createDataChannel('zmb'));
    await p.pc.setLocalDescription(await p.pc.createOffer());await waitIce(p.pc);
    const sdp=p.pc.localDescription.sdp;
    if(!/a=candidate/.test(sdp)){this.drop(p);throw new Error('No se detecta red local. ¿Wi-Fi conectado?')}
    p.code=await encDesc(p.pc.localDescription);this.peers.set(p.id,p);return p;
  },
  async hostAccept(p,code){
    const d=await decDesc(code);
    if(d.type!=='answer')throw new Error('Eso es un código A, aquí va el código B del móvil');
    await p.pc.setRemoteDescription(d);
  },
  /* invitado (barra): recibe código A -> devuelve código B */
  async guestAnswer(code){
    const d=await decDesc(code);
    if(d.type!=='offer')throw new Error('Eso es un código B; aquí va el código A de la cocina');
    this.peers.forEach(x=>this.drop(x));
    const p=this.mkPeer();p.pc.ondatachannel=e=>this.wire(p,e.channel);
    await p.pc.setRemoteDescription(d);
    await p.pc.setLocalDescription(await p.pc.createAnswer());await waitIce(p.pc);
    this.peers.set(p.id,p);p.code=await encDesc(p.pc.localDescription);return p;
  }
};

/* =====================================================================
   INFORME DE CIERRE DE CAJA
   ===================================================================== */
function aggregate(list){
  const prod=new Map(),wt=new Map();let total=0;
  list.forEach(o=>{
    total+=cents(o.total);
    const w=wt.get(o.w)||{n:0,c:0};w.n++;w.c+=cents(o.total);wt.set(o.w,w);
    o.items.forEach(i=>{const k=i.n;const a=prod.get(k)||{q:0,c:0};a.q+=i.q;a.c+=cents(i.p)*i.q;prod.set(k,a)});
  });
  return{prod,wt,total,n:list.length};
}
function buildReport(list,title,extra){
  const a=aggregate(list),L='─'.repeat(44),f=c=>eur(c/100).replace(/ /g,' ');
  const rows=[...a.prod.entries()].sort((x,y)=>y[1].c-x[1].c);
  const w=Math.max(10,...rows.map(r=>r[0].length))+1;
  let t=`SOLERA TPV · CIERRE DE CAJA\n${title}\nFecha: ${fmtDT(Date.now())}\n${L}\n`;
  t+=`Pedidos:            ${a.n}\nTOTAL RECAUDADO:    ${f(a.total)}\nTicket medio:       ${a.n?f(Math.round(a.total/a.n)):f(0)}\n${L}\nDESGLOSE POR PRODUCTO\n`;
  rows.forEach(([n,v])=>{t+=`${n.padEnd(w)}x${String(v.q).padStart(4)}  ${f(v.c).padStart(11)}\n`});
  t+=`${L}\nPOR CAMARERO\n`;
  [...a.wt.entries()].sort((x,y)=>String(x[0]).localeCompare(String(y[0]),'es',{numeric:true})).forEach(([k,v])=>{t+=`${String(k).padEnd(w)}${String(v.n).padStart(4)} ped ${f(v.c).padStart(11)}\n`});
  if(extra)t+=`${L}\n${extra}\n`;
  let csv='﻿Producto;Unidades;Importe (EUR)\n';
  rows.forEach(([n,v])=>{csv+=`"${n.replace(/"/g,'""')}";${v.q};${(v.c/100).toFixed(2).replace('.',',')}\n`});
  csv+=`\nTOTAL;${a.n} pedidos;${(a.total/100).toFixed(2).replace('.',',')}\n\nCamarero;Pedidos;Importe (EUR)\n`;
  a.wt.forEach((v,k)=>{csv+=`"${k}";${v.n};${(v.c/100).toFixed(2).replace('.',',')}\n`});
  return{txt:t,csv};
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function openReport(list,title,extra){
  const r=buildReport(list,title,extra);
  const m=modal(`<h2>Cierre de caja</h2><div class="rep">${esc(r.txt)}</div><div class="r"><button class="btn pri" data-t>⬇ Descargar informe (.txt)</button><button class="btn" data-c>⬇ CSV para Excel</button></div>`,'wide');
  $('[data-t]',m).onclick=()=>download(`cierre-caja-${ROLE}-${stamp()}.txt`,r.txt,'text/plain');
  $('[data-c]',m).onclick=()=>download(`cierre-caja-${ROLE}-${stamp()}.csv`,r.csv,'text/csv');
}

let orders=[],byId=new Map();          // pedidos de este dispositivo
let cart=store.get('zmb.cart',{}),waiter=store.get('zmb.w','');
let curCat=0,kLast=0,wasAlive=false,sendLock=false;
const barAlive=()=>Date.now()-kLast<ALIVE_MS;
const outstanding=()=>orders.filter(o=>o.st!=='done');
const priceOf=n=>{for(const c of MENU)for(const i of c.items)if(i.n===n)return i.p;return null};
const cartItems=()=>Object.entries(cart).map(([n,q])=>({n,p:priceOf(n),q})).filter(i=>i.p!=null&&i.q>0);
const cartTotal=()=>cartItems().reduce((s,i)=>s+cents(i.p)*i.q,0)/100;

}

  $('#grid').innerHTML=c.items.map(i=>`<button class="prod" data-n="${esc(i.n)}" style="--c:${catColor(curCat)}"><span class="pn">${esc(i.n)}</span><span class="pp">${eur(i.p)}</span><span class="badge">+0</span><span class="minus" data-m>−</span></button>`).join('');

function updateCart(bumpName,bump){
  $$('.prod').forEach(b=>{
    const q=cart[b.dataset.n]||0;b.classList.toggle('has',q>0);
    const bd=$('.badge',b);bd.textContent='+'+q;

  });

  s.textContent=items.length?`ENVIAR A COCINA (${eur(tot)})`:'Toca productos para empezar';
  $('#sumtxt').textContent=items.map(i=>`${i.q}× ${i.n}`).join(' · ');
  $('#clr').style.display=items.length?'':'none';

function submitOrder(){
  if(sendLock)return;const items=cartItems();if(!items.length)return;
  if(!waiter){const w=$('#waiters');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');toast('Elige tu camarero primero',{kind:'warn'});buzz([60,40,60]);openPad();return}
  sendLock=true;setTimeout(()=>sendLock=false,600);
  const o={id:DEV+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),w:waiter,items:items.map(i=>({n:i.n,p:i.p,q:i.q})),total:cartTotal(),ts:Date.now(),st:'queued',num:null};
  cart={};updateCart();                      // carrito limpio al instante
  orders.push(o);byId.set(o.id,o);transmit(o);DB.put(o);
  buzz([30,30,60]);
  toast(barAlive()?'✔ Enviado a cocina':'⏳ Sin cocina: guardado en cola',{kind:barAlive()?'ok':'warn',ms:1600});
  updatePill();
}
function transmit(o){
  Net.send({t:'order',dev:DEV,w:waiter,o:{id:o.id,w:o.w,items:o.items,total:o.total,ts:o.ts}});
  if(o.st==='queued'&&barAlive()){o.st='sent';DB.put(o)}
}
function applyStatus(id,num,st){
  const o=byId.get(id);if(!o)return;
  const ns=st==='done'?'done':'acked';let ch=false;
  if(num!=null&&o.num!==num){o.num=num;ch=true}
  if(o.st!==ns){const was=o.st;o.st=ns;ch=true;if(ns==='done'&&was!=='done'){chimeReady();toast(`✔ Pedido #${pad(o.num||0)} LISTO · ${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}`,{kind:'ok',ms:5000})}}
  if(ch){DB.put(o);updatePill()}
}
function bHandle(m){
  if(!m||m.src!=='cocina')return;if(m.to&&m.to!==DEV)return;
  kLast=Date.now();
  if(m.t==='ack')applyStatus(m.id,m.num,m.st);
  else if(m.t==='status')applyStatus(m.id,m.num,m.st);
  else if(m.t==='pong'){
    const known=new Set();(m.st||[]).forEach(([id,num,st])=>{known.add(id);applyStatus(id,num,st)});
    orders.filter(o=>(o.st==='queued'||o.st==='sent')&&!known.has(o.id)).forEach(transmit);
  }
  checkAlive();
}
function checkAlive(){
  const a=barAlive();
  if(a&&!wasAlive){toast('● Conectado con cocina',{kind:'ok',ms:1500});orders.filter(o=>o.st==='queued'||o.st==='sent').forEach(transmit)}
  if(!a&&wasAlive)toast('○ Cocina sin señal · los pedidos quedan en cola',{kind:'warn',ms:3000});
  wasAlive=a;
}
function updatePill(){
  const p=$('#pill');if(!p)return;const a=barAlive(),q=orders.filter(o=>o.st==='queued'||o.st==='sent').length;
  p.className='pill '+(a?'ok':'off');
  p.textContent=a?(q?`COCINA · ${q} enviando`:'COCINA'):`SIN COCINA${q?' · '+q+' en cola':''}`;
}
function barMenu(){
  const m=modal(`<h2>Menú</h2>
    <button class="mrow" data-a="caja"><i>${ICON.cash}</i>Cierre de caja</button>
    <button class="mrow" data-a="hist"><i>${ICON.receipt}</i>Mis pedidos</button>
    <button class="mrow" data-a="net"><i>${ICON.wifi}</i>Conectar con cocina</button>
    <button class="mrow" data-a="menu"><i>${ICON.edit}</i>Editar menú / precios</button>
    <button class="mrow" data-a="role"><i>${ICON.swap}</i>Cambiar de modo</button>
    <button class="mrow red" data-a="reset"><i>${ICON.trash}</i>Nueva noche (borrar datos)</button>`);
  $$('[data-a]',m).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;m.close();
    if(a==='caja')openReport(orders,`BARRA · dispositivo ${DEV}`,`Pendientes de sincronizar con cocina: ${orders.filter(o=>o.st==='queued'||o.st==='sent').length}`);
    else if(a==='hist')barHistory();else if(a==='net')barPairing();else if(a==='menu')menuEditor();else if(a==='role')changeRole();
    else if(a==='reset')confirmBox('Se borrarán todos los pedidos de este móvil. Descarga antes el cierre de caja.','BORRAR TODO',async()=>{await DB.clear();orders=[];byId.clear();cart={};updateCart();updatePill();toast('Datos borrados',{kind:'warn'})});
  });
}
function barHistory(){
  const rows=orders.slice(-40).reverse().map(o=>{
    const s=o.st==='done'?['✔ LISTO','d']:o.st==='acked'?['EN COCINA','k']:['EN COLA','q'];
    return `<div class="hrow"><div class="n">${o.num!=null?'#'+pad(o.num):'···'}</div><div class="d">${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}<br>${esc(o.w)} · ${eur(o.total)}</div><div class="s ${s[1]}">${s[0]}</div></div>`}).join('');
  modal(`<h2>Mis pedidos</h2>${rows||'<p class="hint">Todavía no hay pedidos.</p>'}`);
}
function barPairing(){
  const m=modal(`<h2>Conectar con cocina</h2>
    <p class="hint">Mismo Wi-Fi (no hace falta internet). Solo hay que hacerlo una vez por conexión.</p>
    <label>1 · CÓDIGO A (te lo da la cocina)</label><textarea class="code" rows="3" placeholder="Pega aquí el código A"></textarea>
    <div class="r"><button class="btn" data-p>Pegar</button><button class="btn pri" data-g>Generar respuesta</button></div>
    <div data-b hidden><label>2 · CÓDIGO B (llévaselo a la cocina)</label><textarea class="code" rows="3" readonly></textarea>
      <div class="r"><button class="btn" data-c>Copiar</button><button class="btn" data-s>Compartir</button></div><div class="st" data-st>Esperando a la cocina…</div></div>`);
  const [ta,tb]=$$('textarea',m);
  $('[data-p]',m).onclick=()=>pasteInto(ta);
  $('[data-g]',m).onclick=async e=>{
    e.target.disabled=true;
    try{
      const p=await Net.guestAnswer(ta.value);tb.value=p.code;$('[data-b]',m).hidden=false;
      p.onopen=()=>{kLast=0;Net.send({t:'ping',dev:DEV,w:waiter,open:outstanding().map(o=>o.id)});const s=$('[data-st]',m);if(s){s.textContent='✔ Conectado';s.className='st ok'}buzz(60);setTimeout(()=>m.isConnected&&m.close(),900)};
      p.onfail=()=>{const s=$('[data-st]',m);if(s){s.textContent='✖ No se pudo conectar. Repite el proceso.';s.className='st bad'}};
    }catch(err){toast(esc(err.message),{kind:'bad',ms:3500})}
    e.target.disabled=false;
  };
  $('[data-c]',m).onclick=()=>copyText(tb.value,tb);
  $('[data-s]',m).onclick=()=>shareText(tb.value);
}

/* =====================================================================
   COCINA (tablet)
   ===================================================================== */
const seen=new Map();let nextNum=1;
const kAlive=()=>[...seen.values()].filter(s=>Date.now()-s.last<ALIVE_MS);
const WCOLORS=['#e8c07a','#8ecae6','#b8e0a0','#f2a6b3','#c3b1e1','#f5b78a','#9fd8cb','#e6d98f'];
const wColor=w=>{let h=0;for(const ch of String(w))h=(h*31+ch.charCodeAt(0))>>>0;return WCOLORS[h%WCOLORS.length]};
const wLabel=w=>/^\d+$/.test(w)?'CAMARERO '+w:String(w).toUpperCase();

async function startKitchen(){
  orders=(await DB.all()).sort((a,b)=>a.num-b.num);orders.forEach(o=>byId.set(o.id,o));
  nextNum=orders.reduce((m,o)=>Math.max(m,o.num),0)+1;
  $('#app').innerHTML=`
  <header class="kh"><div class="brand"><b>${BRAND}</b><small>COCINA</small></div><div class="cnt" id="cnt">0 PENDIENTES</div>
    <button class="pill off" id="pill"></button><div class="sp"></div>
    <button class="ico" id="bSnd" aria-label="Sonido"></button>
    <button class="ico" id="bRec" aria-label="Entregadas">${ICON.undo}</button>
    <button class="ico" id="bMenu" aria-label="Menú">${ICON.menu}</button></header>
  <main class="kgrid" id="kgrid"><div class="empty" id="empty"><b>${ICON.check}</b>Sin comandas pendientes</div></main>`;
  $('#bMenu').onclick=kMenu;$('#pill').onclick=hostPairing;$('#bRec').onclick=recentList;
  const snd=()=>{$('#bSnd').innerHTML=soundOn?ICON.bell:ICON.bellOff};snd();
  $('#bSnd').onclick=()=>{soundOn=!soundOn;store.set('zmb.sound',soundOn);snd();if(soundOn)ringNew()};
  Net.init(kHandle);
  renderKitchen();
  setInterval(()=>{tick();kPill()},1000);kPill();
  keepAwake();
  toast('Toca cualquier botón una vez para activar el sonido',{kind:'warn',ms:4000});
}
function kHandle(m,reply){
  if(!m||m.src!=='barra')return;const now=Date.now();
  if(m.dev){const s=seen.get(m.dev);seen.set(m.dev,{dev:m.dev,w:m.w||(s&&s.w)||'?',last:now})}
  if(m.t==='ping'){
    const st=[];(m.open||[]).forEach(id=>{const o=byId.get(id);if(o)st.push([id,o.num,o.st])});
    reply({t:'pong',to:m.dev,st});
  }else if(m.t==='order'&&m.o&&m.o.id){
    const o=ingest(m.o);reply({t:'ack',to:m.dev,id:o.id,num:o.num,st:o.st});
  }
  kPill();
}
function ingest(o){
  let r=byId.get(o.id);if(r)return r;
  r={id:o.id,num:nextNum++,w:o.w,items:o.items,total:o.total,ts:o.ts,rcv:Date.now(),st:'new'};
  orders.push(r);byId.set(r.id,r);DB.put(r);renderKitchen(r.id);ringNew();return r;
}
function cardEl(o,fresh){
  const c=document.createElement('article');c.className='card'+(fresh?' fresh':'');c.dataset.id=o.id;c.dataset.num=o.num;c.dataset.rcv=o.rcv;
  c.style.setProperty('--wc',wColor(o.w));
  c.innerHTML=`<div class="ch"><div class="num">#${pad(o.num)}</div><div class="chr"><div class="wtag">${esc(wLabel(o.w))}</div><div class="tm">00:00</div></div></div>
    <ul class="li">${o.items.map(i=>`<li><b>${i.q}×</b> ${esc(i.n)}</li>`).join('')}</ul>
    <button class="done">LISTO / ENTREGADO</button>`;
  $('.done',c).onclick=()=>markDone(o.id);
  if(fresh)setTimeout(()=>c.classList.remove('fresh'),2500);
  return c;
}
function renderKitchen(freshId){
  const grid=$('#kgrid');if(!grid)return;
  const pend=orders.filter(o=>o.st==='new').sort((a,b)=>a.num-b.num),want=new Set(pend.map(o=>o.id));
  $$('.card',grid).forEach(c=>{if(!want.has(c.dataset.id))c.remove()});
  const have=new Set($$('.card',grid).map(c=>c.dataset.id));
  pend.forEach(o=>{
    if(have.has(o.id))return;
    const el=cardEl(o,o.id===freshId);
    const after=$$('.card',grid).find(c=>+c.dataset.num>o.num);
    after?grid.insertBefore(el,after):grid.append(el);
  });
  $('#empty').style.display=pend.length?'none':'';
  $('#cnt').textContent=pend.length+(pend.length===1?' PENDIENTE':' PENDIENTES');
  tick();
}
function tick(){
  const now=Date.now();
  $$('.card').forEach(c=>{
    const s=Math.max(0,Math.floor((now-(+c.dataset.rcv))/1000));
    $('.tm',c).textContent=pad(Math.floor(s/60),2)+':'+pad(s%60,2);
    c.classList.toggle('warn',s>=300&&s<600);c.classList.toggle('crit',s>=600);
  });
}
function kPill(){
  const p=$('#pill');if(!p)return;const n=kAlive().length;
  p.className='pill '+(n?'ok':'off');p.textContent=n?`${n} CAMARERO${n>1?'S':''}`:'SIN CAMAREROS · CONECTAR';
  const l=$('#plist');if(l)l.innerHTML=kAlive().map(s=>`<div class="hrow"><div class="n">${esc(s.w)}</div><div class="d">dispositivo ${esc(s.dev)}</div><div class="s d">● en línea</div></div>`).join('')||'<p class="hint">Ninguno todavía.</p>';
}
function markDone(id){
  const o=byId.get(id);if(!o||o.st!=='new')return;
  o.st='done';o.doneAt=Date.now();DB.put(o);buzz(30);
  Net.send({t:'status',id:o.id,num:o.num,st:'done'});
  const c=$(`.card[data-id="${CSS.escape(id)}"]`);if(c)c.classList.add('out');
  setTimeout(()=>renderKitchen(),290);
  toast(`#${pad(o.num)} entregado`,{ms:6000,action:['DESHACER',()=>undo(id)]});
}
function undo(id){
  const o=byId.get(id);if(!o||o.st!=='done')return;
  o.st='new';delete o.doneAt;DB.put(o);Net.send({t:'status',id:o.id,num:o.num,st:'new'});renderKitchen();
}
function recentList(){
  const rows=orders.filter(o=>o.st==='done').sort((a,b)=>b.doneAt-a.doneAt).slice(0,20).map(o=>`<div class="hrow"><div class="n">#${pad(o.num)}</div><div class="d">${esc(wLabel(o.w))}<br>${o.items.map(i=>i.q+'× '+esc(i.n)).join(', ')}</div><button class="btn" data-u="${esc(o.id)}">Recuperar</button></div>`).join('');
  const m=modal(`<h2>Entregadas recientemente</h2>${rows||'<p class="hint">Nada todavía.</p>'}`);
  $$('[data-u]',m).forEach(b=>b.onclick=()=>{undo(b.dataset.u);m.close()});
}
function kMenu(){
  const m=modal(`<h2>Menú cocina</h2>
    <button class="mrow" data-a="net"><i>${ICON.wifi}</i>Conectar camareros</button>
    <button class="mrow" data-a="caja"><i>${ICON.cash}</i>Cierre de caja (todas las barras)</button>
    <button class="mrow" data-a="role"><i>${ICON.swap}</i>Cambiar de modo</button>
    <button class="mrow red" data-a="reset"><i>${ICON.trash}</i>Nueva noche (borrar datos)</button>`);
  $$('[data-a]',m).forEach(b=>b.onclick=()=>{
    const a=b.dataset.a;m.close();
    if(a==='net')hostPairing();
    else if(a==='caja')openReport(orders,'COCINA · todos los pedidos recibidos',`Pendientes de entregar: ${orders.filter(o=>o.st==='new').length}`);
    else if(a==='role')changeRole();
    else if(a==='reset')confirmBox('Se borrarán TODAS las comandas de la cocina y el contador volverá a #001. Descarga antes el cierre de caja.','BORRAR TODO',async()=>{await DB.clear();orders=[];byId.clear();nextNum=1;renderKitchen();toast('Datos borrados',{kind:'warn'})});
  });
}
function hostPairing(){
  const m=modal(`<h2>Conectar camareros</h2>
    <p class="hint">Todos en el mismo Wi-Fi (sin internet vale). Por cada móvil: <b>1)</b> pásale el CÓDIGO A (copiar/compartir, AirDrop, Nearby Share…), <b>2)</b> pega aquí el CÓDIGO B que te devuelve. Si estáis en la misma tablet/PC con pestañas, se conectan solos.</p>
    <div id="slots"></div><button class="btn pri full" data-add>＋ Añadir camarero</button>
    <h3>CONECTADOS</h3><div id="plist"></div>`,'wide');
  kPill();
  $('[data-add]',m).onclick=()=>addSlot($('#slots',m));addSlot($('#slots',m));
}
async function addSlot(box){
  const s=document.createElement('div');s.className='slot';
  s.innerHTML=`<div class="slt"><b>Nuevo camarero</b><span class="st">Generando código…</span></div>
    <label>CÓDIGO A · para el móvil</label><textarea class="code" rows="3" readonly></textarea>
    <div class="r"><button class="btn" data-c>Copiar</button><button class="btn" data-s>Compartir</button></div>
    <label>CÓDIGO B · respuesta del móvil</label><textarea class="code" rows="3" placeholder="Pega aquí el código B"></textarea>
    <div class="r"><button class="btn" data-p>Pegar</button><button class="btn pri" data-ok>Conectar</button></div>`;
  box.append(s);
  const [ta,tb]=$$('textarea',s),st=$('.st',s);
  try{
    const p=await Net.hostOffer();ta.value=p.code;st.textContent='Esperando código B…';
    p.onopen=()=>{st.textContent='✔ Conectado';st.className='st ok';buzz(60);setTimeout(()=>s.remove(),1500)};
    p.onfail=()=>{st.textContent='✖ Falló. Quita este y añade otro.';st.className='st bad'};
    $('[data-ok]',s).onclick=async()=>{
      try{st.textContent='Conectando…';await Net.hostAccept(p,tb.value)}catch(e){st.textContent='✖ '+e.message;st.className='st bad'}
    };
  }catch(e){st.textContent='✖ '+e.message;st.className='st bad'}
  $('[data-c]',s).onclick=()=>copyText(ta.value,ta);
  $('[data-s]',s).onclick=()=>shareText(ta.value);
  $('[data-p]',s).onclick=()=>pasteInto(tb);
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async()=>{
  if(!ROLE){showPicker();return}
  document.title=(ROLE==='barra'?'Barra':'Cocina')+' · Solera TPV';
  await DB.init();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch{}
  try{ROLE==='barra'?await startBar():await startKitchen()}catch(e){console.error(e);$('#app').innerHTML='<p style="padding:20px">Error al iniciar: '+esc(e.message)+'</p>'}
})();
addEventListener('hashchange',()=>location.reload());
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
