<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090a">
<meta name="robots" content="noindex,nofollow">
<title>Solera TPV · Administración</title>
<style>
:root{--bg:#09090a;--s1:#121110;--s2:#181716;--s3:#211f1d;--line:#262321;--line2:#37332f;--tx:#f3eee6;--mut:#8f8981;--gold:#c9a36a;--ok:#3fbf8b;--okd:#03150e;--amb:#f2a33a;--red:#ff5c5c;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background-color:var(--bg);background-image:radial-gradient(900px 420px at 50% -8%,rgba(201,163,106,.09),transparent 70%);background-attachment:fixed}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"SF Pro Display","Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--tx)}
h2{margin:0 0 4px;font-size:22px;font-weight:650;letter-spacing:-.01em}
.hint{color:var(--mut);font-size:14px;line-height:1.5;margin:4px 0 16px}
.brand{font-family:var(--serif);font-size:28px;line-height:1}
.brand small{font-family:inherit;font-size:10px;letter-spacing:.24em;font-weight:600;color:var(--gold);margin-left:10px;font-family:"SF Pro Display","Inter",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
.top{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .sp{flex:1}.who{color:var(--mut);font-size:13px}
.btn{min-height:40px;padding:0 16px;border-radius:11px;background:var(--s3);font-weight:600;font-size:14px;border:1px solid var(--line2)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--ok);color:var(--okd);border-color:var(--ok)}
.btn.red{color:#ff9b9b;border-color:rgba(255,92,92,.35);background:rgba(255,92,92,.08)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}
.tabs{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:12px 18px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.sel{color:var(--tx);border-bottom-color:var(--gold)}
.card{background:var(--s1);border:1px solid var(--line2);border-radius:18px;padding:16px;margin-bottom:14px}
.chead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chead input{flex:1;min-width:140px;font-size:17px;font-weight:650}
input[type=text],input[type=number],input[type=email],input[type=password],select{height:42px;border-radius:11px;background:var(--bg);border:1px solid var(--line2);padding:0 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 110px 112px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row.off input[type=text],.row.off input[type=number]{opacity:.5}
.row .acts{display:flex;gap:4px}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);cursor:pointer;user-select:none}
.sw input{width:20px;height:20px;accent-color:var(--ok)}
.sw.on{color:var(--ok)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.14em;color:var(--mut);text-align:left;font-weight:600;padding:8px 6px}
td{padding:10px 6px;border-top:1px solid var(--line);font-size:14px}
td select{height:38px;width:auto}
.tag{font-size:12px;color:var(--mut)}
.login{max-width:400px;margin:0 auto;padding:12vh 20px 40px}
.login .brand{font-size:56px;margin-bottom:6px}
.login .by{font-size:11.5px;letter-spacing:.26em;color:var(--gold);font-weight:600;padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line2)}
label{display:block;font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--mut);margin:14px 0 5px}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px!important;letter-spacing:.06em;text-align:center}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:99;background:rgba(24,24,27,.96);border:1px solid var(--line2);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1}#toast.ok{border-color:rgba(63,191,139,.6);color:#9be8c6}#toast.bad{border-color:rgba(255,92,92,.6);color:#ff9b9b}
h3{margin:0 0 10px;font-size:11px;color:var(--mut);letter-spacing:.16em;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.kpi{background:var(--s1);border:1px solid var(--line2);border-radius:16px;padding:14px}.kpi small{font-size:10.5px;letter-spacing:.14em;color:var(--mut);font-weight:600}.kpi b{display:block;font-size:26px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.goalbar{height:18px;border-radius:99px;background:var(--s3);overflow:hidden}.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));border-radius:99px}
.pbar{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin-bottom:6px;border-radius:10px;overflow:hidden;font-size:14px;background:var(--s2)}.pbar i{position:absolute;left:0;top:0;bottom:0;background:rgba(201,163,106,.22)}.pbar span,.pbar b{position:relative}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px}.hist div{flex:1;max-width:70px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative}.hist i{display:block;width:100%;background:var(--gold);border-radius:6px 6px 0 0}.hist small{font-size:10px;color:var(--mut);margin-top:4px}.hist em{font-style:normal;font-size:10px;position:absolute;top:0;color:var(--mut)}
@media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
@media(max-width:640px){.row{grid-template-columns:1fr 96px;}.row .sw,.row .acts{grid-column:1/-1}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
(()=>{
'use strict';
const SB={url:'https://trvpotojljatuoyegbbu.supabase.co',key:'sb_publishable_fQ20fycMsWe3PHCXSNV1kQ_BCdh9P9W'};
const SESS_KEY='zmb.sess';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const eur=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(n);
let tt;function toast(m,k='ok'){const t=$('#toast');t.textContent=m;t.className='on '+k;clearTimeout(tt);tt=setTimeout(()=>t.className='',1800)}

async function sb(path,{method='GET',body,token,headers={},timeout=10000}={}){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),timeout);
  try{
    const r=await fetch(SB.url+path,{method,signal:ac.signal,headers:Object.assign({apikey:SB.key,'Content-Type':'application/json'},token?{Authorization:'Bearer '+token}:{},headers),body:body!==undefined?JSON.stringify(body):undefined});
    let j=null;try{j=await r.json()}catch{}
    if(!r.ok){const e=new Error((j&&(j.error_description||j.msg||j.error||j.message))||('HTTP '+r.status));e.status=r.status;throw e}
    return j;
  }catch(e){if(e.status===undefined)e.net=true;throw e}finally{clearTimeout(t)}
}
let S=lsGet(SESS_KEY);
async function token(){
  if(S.exp-Date.now()>60000)return S.at;
  const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:S.rt}});
  S.at=j.access_token;S.rt=j.refresh_token;S.exp=Date.now()+j.expires_in*1000;lsSet(SESS_KEY,S);return S.at;
}
const api=async(p,o={})=>sb(p,Object.assign({token:await token()},o));
function logout(){try{localStorage.removeItem(SESS_KEY)}catch{}S=null;showLogin()}

/* ---------- login ---------- */
function showLogin(msg=''){
  $('#app').innerHTML=`<div class="login"><div class="brand">Solera</div><div class="by">ADMINISTRACIÓN · BY VØLDEN</div>
    <form id="f"><label>CORREO</label><input type="email" name="email" autocomplete="email" autocapitalize="off">
    <label>CONTRASEÑA</label><input type="password" name="password" autocomplete="current-password">
    <div class="err" id="err">${esc(msg)}</div><button class="btn pri" style="width:100%;height:48px;margin-top:8px">Entrar</button></form></div>`;
  $('#f').onsubmit=async e=>{
    e.preventDefault();const f=e.target,err=$('#err'),b=$('button',f);err.textContent='';b.disabled=true;
    try{
      const j=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:f.email.value.trim().toLowerCase(),password:f.password.value}});
      const pr=await sb(`/rest/v1/profiles?id=eq.${j.user.id}&select=name,email,role,active`,{token:j.access_token});const p=pr&&pr[0];
      if(!p||!p.active||p.role!=='admin'){err.textContent='Esta cuenta no es de administrador.';b.disabled=false;return}
      S={at:j.access_token,rt:j.refresh_token,exp:Date.now()+j.expires_in*1000,uid:j.user.id,name:p.name,email:p.email,role:p.role,ver:Date.now()};lsSet(SESS_KEY,S);showApp();
    }catch(x){err.textContent=x.net?'Sin conexión a internet.':/Invalid login/i.test(x.message)?'Correo o contraseña incorrectos':x.message;b.disabled=false}
  };
}

/* ---------- app ---------- */
let tab='ventas',items=[],team=[],code='',goal=0,evName='',salesT=0;
async function showApp(){
  $('#app').innerHTML=`<div class="wrap"><div class="top"><div class="brand">Solera<small>ADMINISTRACIÓN</small></div><div class="sp"></div><span class="who">${esc(S.name)} · ${esc(S.email)}</span><button class="btn sm" id="out">Cerrar sesión</button></div>
    <div class="tabs">${[['ventas','Ventas'],['carta','Carta y precios'],['equipo','Equipo'],['acceso','Evento y acceso'],['cocina','Cocina y barra']].map(([k,l])=>`<button class="tab" data-t="${k}">${l}</button>`).join('')}</div><div id="view"></div></div>`;
  $('#out').onclick=logout;
  $$('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  draw();
}
async function draw(){
  $$('.tab').forEach(b=>b.classList.toggle('sel',b.dataset.t===tab));
  const v=$('#view');v.innerHTML='<p class="hint">Cargando…</p>';
  try{
    if(tab==='ventas'){await drawSales();return}
    if(tab==='carta'){items=await api('/rest/v1/menu_items?select=*&order=sort.asc');drawMenu()}
    else if(tab==='equipo'){team=await api('/rest/v1/profiles?select=id,name,email,role,active,created_at&order=created_at.asc');drawTeam()}
    else if(tab==='acceso'){const r=await api('/rest/v1/settings?select=key,value&key=in.(access_code,goal,event_name)');code='';goal=0;evName='';(r||[]).forEach(x=>{if(x.key==='access_code')code=x.value;if(x.key==='goal')goal=Number(x.value)||0;if(x.key==='event_name')evName=x.value||''});drawAccess()}
    else drawKitchen();
  }catch(e){
    if(e.status===401||e.status===400){logout();return}
    v.innerHTML=`<p class="hint" style="color:var(--red)">${e.net?'Sin conexión a internet.':esc(e.message)}</p>`;
  }
}

/* ---------- carta ---------- */
const groups=()=>{const m=new Map();items.slice().sort((a,b)=>a.sort-b.sort).forEach(i=>{if(!m.has(i.category))m.set(i.category,[]);m.get(i.category).push(i)});return [...m]};
function drawMenu(){
  const g=groups();
  $('#view').innerHTML=`<h2>Carta y precios</h2><p class="hint">Los cambios se guardan solos y llegan a los móviles cuando tengan internet. “Disponible” apagado = el producto no aparece en barra. Cada categoría la prepara la cocina o la sirve el camarero (barra): la tablet de cocina solo gestiona lo suyo y los camareros marcan en su móvil lo que van sirviendo. Para marcar algo agotado durante el servicio, hazlo desde la cocina (llega al instante).</p>
  ${g.map(([cat,list],gi)=>`<div class="card" data-cat="${esc(cat)}">
    <div class="chead"><input type="text" value="${esc(cat)}" data-rencat="${esc(cat)}" maxlength="30">
      <select data-st="${esc(cat)}" title="Dónde se prepara" style="width:auto;height:34px"><option value="cocina" ${list[0]&&list[0].station!=='barra'?'selected':''}>Cocina la prepara</option><option value="barra" ${list[0]&&list[0].station==='barra'?'selected':''}>Lo sirve el camarero (barra)</option></select><button class="btn sm" data-mvcat="${gi}" data-d="-1" ${gi===0?'disabled':''}>↑</button><button class="btn sm" data-mvcat="${gi}" data-d="1" ${gi===g.length-1?'disabled':''}>↓</button>
      <button class="btn sm pri" data-addprod="${esc(cat)}">＋ Producto</button><button class="btn sm red" data-delcat="${esc(cat)}">Borrar categoría</button></div>
    ${list.map((i,ii)=>`<div class="row ${i.active?'':'off'}" data-id="${i.id}">
      <input type="text" value="${esc(i.name)}" data-f="name" maxlength="40"><input type="number" step="0.05" min="0" inputmode="decimal" value="${Number(i.price)}" data-f="price">
      <label class="sw ${i.active?'on':''}" style="margin:0;letter-spacing:0;font-size:13px;font-weight:500"><input type="checkbox" data-f="active" ${i.active?'checked':''}>${i.active?'Disponible':'Agotado'}</label>
      <div class="acts"><button class="btn sm" data-mv="${i.id}" data-d="-1" ${ii===0?'disabled':''}>↑</button><button class="btn sm" data-mv="${i.id}" data-d="1" ${ii===list.length-1?'disabled':''}>↓</button><button class="btn sm red" data-del="${i.id}">✕</button></div></div>`).join('')}
  </div>`).join('')}
  <div class="card"><div class="chead"><input type="text" id="newcat" placeholder="Nombre de la nueva categoría (p. ej. Tapas)" maxlength="30"><button class="btn pri" id="addcat">＋ Añadir categoría</button></div></div>`;
  const v=$('#view');
  v.onchange=async e=>{
    const t=e.target,row=t.closest('.row');
    try{
      if(t.dataset.st!==undefined){await api(`/rest/v1/menu_items?category=eq.${encodeURIComponent(t.dataset.st)}`,{method:'PATCH',body:{station:t.value},headers:{Prefer:'return=minimal'}});items.forEach(i=>{if(i.category===t.dataset.st)i.station=t.value});toast('Destino guardado ✓');return}
      if(t.dataset.rencat!==undefined){
        const nv=t.value.trim(),old=t.dataset.rencat;if(!nv||nv===old){t.value=old;return}
        await api(`/rest/v1/menu_items?category=eq.${encodeURIComponent(old)}`,{method:'PATCH',body:{category:nv},headers:{Prefer:'return=minimal'}});
        items.forEach(i=>{if(i.category===old)i.category=nv});toast('Categoría renombrada');drawMenu();return;
      }
      if(!row)return;const id=row.dataset.id,f=t.dataset.f,it=items.find(x=>x.id===id);let val;
      if(f==='price'){val=Math.round(parseFloat(String(t.value).replace(',','.'))*100)/100;if(!(val>=0)){t.value=it.price;toast('Precio no válido','bad');return}}
      else if(f==='active')val=t.checked;else{val=t.value.trim();if(!val){t.value=it.name;return}}
      await api(`/rest/v1/menu_items?id=eq.${id}`,{method:'PATCH',body:{[f]:val},headers:{Prefer:'return=minimal'}});
      it[f]=val;toast('Guardado ✓');if(f==='active')drawMenu();
    }catch(x){toast(x.net?'Sin conexión':x.message,'bad')}
  };
  v.onclick=async e=>{
    const b=e.target.closest('button');if(!b)return;
    try{
      if(b.id==='addcat'){const n=$('#newcat').value.trim();if(!n)return;await addItem(n);return}
      if(b.dataset.addprod!==undefined){await addItem(b.dataset.addprod);return}
      if(b.dataset.del){if(!confirm('¿Borrar este producto?'))return;await api(`/rest/v1/menu_items?id=eq.${b.dataset.del}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});items=items.filter(i=>i.id!==b.dataset.del);drawMenu();toast('Borrado');return}
      if(b.dataset.delcat!==undefined){if(!confirm(`¿Borrar la categoría “${b.dataset.delcat}” y todos sus productos?`))return;await api(`/rest/v1/menu_items?category=eq.${encodeURIComponent(b.dataset.delcat)}`,{method:'DELETE',headers:{Prefer:'return=minimal'}});items=items.filter(i=>i.category!==b.dataset.delcat);drawMenu();toast('Borrada');return}
      if(b.dataset.mv){await move(groups(),b.dataset.mv,+b.dataset.d,false);return}
      if(b.dataset.mvcat!==undefined){await move(groups(),+b.dataset.mvcat,+b.dataset.d,true)}
    }catch(x){toast(x.net?'Sin conexión':x.message,'bad')}
  };
}
async function addItem(cat){
  const mx=items.reduce((m,i)=>Math.max(m,i.sort),0);
  const same=items.filter(i=>i.category===cat),sort=same.length?Math.max(...same.map(i=>i.sort))+1:mx+1000;
  const r=await api('/rest/v1/menu_items',{method:'POST',body:{category:cat,name:'Nuevo producto',price:0,sort,active:false,station:same.length?same[0].station:(/^bebida/i.test(cat)?'barra':'cocina')},headers:{Prefer:'return=representation'}});
  items.push(r[0]);drawMenu();toast('Producto añadido (edítalo y actívalo)');
}
async function move(g,ref,d,isCat){
  const order=g.map(([c,l])=>[c,l.slice()]);
  if(isCat){const i=ref,j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]]}
  else{for(const [c,l] of order){const i=l.findIndex(x=>x.id===ref);if(i>=0){const j=i+d;if(j<0||j>=l.length)return;[l[i],l[j]]=[l[j],l[i]];break}}}
  const rows=[];order.forEach(([c,l],gi)=>l.forEach((it,ii)=>{const s=(gi+1)*1000+(ii+1)*10;if(it.sort!==s){it.sort=s;rows.push({id:it.id,category:it.category,name:it.name,price:it.price,sort:s,active:it.active,station:it.station||'cocina'})}}));
  if(rows.length)await api('/rest/v1/menu_items?on_conflict=id',{method:'POST',body:rows,headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  drawMenu();
}

/* ---------- equipo ---------- */
function drawTeam(){
  const roles={admin:'Administrador',camarero:'Camarero',cocina:'Cocina'};
  $('#view').innerHTML=`<h2>Equipo</h2><p class="hint">Quien se registra con el código del evento aparece aquí. Para echar a alguien, desactívalo: perderá el acceso la próxima vez que su móvil tenga internet.</p>
  <div class="card"><table><thead><tr><th>NOMBRE</th><th>CORREO</th><th>ROL</th><th>ACTIVO</th></tr></thead><tbody>
  ${team.map(p=>`<tr data-id="${p.id}"><td>${esc(p.name)}</td><td class="tag">${esc(p.email)}</td>
    <td><select data-f="role" ${p.id===S.uid?'disabled':''}>${Object.entries(roles).map(([k,l])=>`<option value="${k}" ${p.role===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td><label class="sw ${p.active?'on':''}" style="margin:0;letter-spacing:0;font-size:13px;font-weight:500"><input type="checkbox" data-f="active" ${p.active?'checked':''} ${p.id===S.uid?'disabled':''}>${p.active?'Sí':'No'}</label></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#view').onchange=async e=>{
    const t=e.target,tr=t.closest('tr');if(!tr||!t.dataset.f)return;const p=team.find(x=>x.id===tr.dataset.id),f=t.dataset.f,val=f==='active'?t.checked:t.value;
    try{await api(`/rest/v1/profiles?id=eq.${p.id}`,{method:'PATCH',body:{[f]:val},headers:{Prefer:'return=minimal'}});p[f]=val;toast('Guardado ✓');if(f==='active')drawTeam()}
    catch(x){toast(x.net?'Sin conexión':x.message,'bad');drawTeam()}
  };
}

/* ---------- código de acceso ---------- */
function drawAccess(){
  $('#view').innerHTML=`<h2>Evento y acceso</h2><p class="hint">Estos datos llegan a los móviles y a la cocina cuando tengan internet.</p>
  <div class="card"><label style="margin-top:0">NOMBRE DEL EVENTO</label><input type="text" id="evn" value="${esc(evName)}" maxlength="40" placeholder="Zambomba solidaria">
  <label>OBJETIVO DE RECAUDACIÓN (€) — sale en el marcador</label><input type="number" id="goal" min="0" step="1" inputmode="numeric" value="${goal||''}" placeholder="0 = sin objetivo">
  <div style="margin-top:12px"><button class="btn pri" id="sevt">Guardar evento</button></div></div>
  <div class="card"><label style="margin-top:0">CÓDIGO DEL EVENTO (para crear cuenta)</label><input type="text" class="code" id="code" value="${esc(code)}" maxlength="40" autocapitalize="off">
  <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn pri" id="save">Guardar código</button><button class="btn" id="gen">Generar uno nuevo</button></div></div>
  <p class="hint">Cómo se registra el personal: abrir Solera TPV → <b>Crear cuenta</b> → nombre, correo, contraseña, “Camarero” o “Cocina” y este código. Cambiar el código solo afecta a registros nuevos.</p>`;
  const put=(k,v)=>api('/rest/v1/settings?on_conflict=key',{method:'POST',body:[{key:k,value:String(v)}],headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
  $('#sevt').onclick=async()=>{try{await put('event_name',$('#evn').value.trim());await put('goal',Math.max(0,Number($('#goal').value)||0));goal=Number($('#goal').value)||0;toast('Evento guardado ✓')}catch(x){toast(x.net?'Sin conexión':x.message,'bad')}};
  $('#gen').onclick=()=>{$('#code').value='solera-'+String(Math.floor(Math.random()*10000)).padStart(4,'0')};
  $('#save').onclick=async()=>{
    const v=$('#code').value.trim();if(v.length<4){toast('Mínimo 4 caracteres','bad');return}
    try{await put('access_code',v);code=v;toast('Código guardado ✓')}catch(x){toast(x.net?'Sin conexión':x.message,'bad')}
  };
}

/* ---------- ventas ---------- */
async function loadAll(path){let out=[],from=0;for(;;){const r=await api(path,{headers:{Range:`${from}-${from+999}`,'Range-Unit':'items'}});out=out.concat(r||[]);if(!r||r.length<1000)break;from+=1000}return out}
async function drawSales(){
  const [os,arq,st]=await Promise.all([loadAll('/rest/v1/orders?select=*&order=ts.asc'),loadAll('/rest/v1/cash_counts?select=*&order=ts.asc'),api('/rest/v1/settings?select=key,value&key=in.(goal,event_name)')]);
  (st||[]).forEach(x=>{if(x.key==='goal')goal=Number(x.value)||0;if(x.key==='event_name')evName=x.value||''});
  const ok=os.filter(o=>o.st!=='void'),voids=os.length-ok.length,c=n=>Math.round(Number(n||0)*100);
  const tot=ok.reduce((s,o)=>s+c(o.total),0),don=ok.reduce((s,o)=>s+c(o.don),0),all=tot+don;
  const by=(fn,val)=>{const m=new Map();ok.forEach(o=>fn(o).forEach(([k,v])=>{const e=m.get(k)||{n:0,c:0,q:0};e.n++;e.c+=v.c;e.q+=v.q||0;m.set(k,e)}));return [...m.entries()]};
  const pays=by(o=>[[o.pay||'—',{c:c(o.total)+c(o.don)}]]),wts=by(o=>[[o.waiter||'?',{c:c(o.total)}]]);
  const pm=new Map();ok.forEach(o=>(o.items||[]).forEach(i=>{const e=pm.get(i.n)||{q:0,c:0};e.q+=i.q;e.c+=c(i.p)*i.q;pm.set(i.n,e)}));
  const prods=[...pm.entries()].sort((a,b)=>b[1].c-a[1].c),pmax=Math.max(1,...prods.map(p=>p[1].c));
  const hrs=new Array(24).fill(0);ok.forEach(o=>{hrs[new Date(Number(o.ts)).getHours()]+=c(o.total)});const hmax=Math.max(1,...hrs),hs=hrs.findIndex(x=>x>0),he=23-[...hrs].reverse().findIndex(x=>x>0);
  const e=n=>eur(n/100),pct=goal?Math.min(100,all/100/goal*100):0;
  const arqRows=arq.map(x=>`<tr><td>${esc(x.name||'')}</td><td class="tag">${new Date(Number(x.ts)).toLocaleString('es-ES')}</td><td>${eur(x.expected)}</td><td>${eur(x.counted)}</td><td style="color:${Number(x.diff)===0?'var(--ok)':'var(--amb)'};font-weight:700">${Number(x.diff)===0?'Cuadra':(x.diff>0?'Sobra ':'Falta ')+eur(Math.abs(x.diff))}</td></tr>`).join('');
  $('#view').innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="flex:1;margin:0">${esc(evName||'Ventas')}</h2><button class="btn sm" id="rf">↻ Actualizar</button><button class="btn sm" id="csv">⬇ CSV</button></div>
  <p class="hint">Actualizado ${new Date().toLocaleTimeString('es-ES')} · se refresca solo cada 30 s. Solo incluye pedidos de móviles que ya hayan tenido internet.</p>
  <div class="kpis"><div class="kpi"><small>RECAUDADO</small><b>${e(all)}</b></div><div class="kpi"><small>PEDIDOS</small><b>${ok.length}</b></div><div class="kpi"><small>TICKET MEDIO</small><b>${ok.length?e(Math.round(tot/ok.length)):'—'}</b></div><div class="kpi"><small>DONATIVOS</small><b>${e(don)}</b></div></div>
  ${goal?`<div class="card"><div class="goalbar"><i style="width:${pct}%"></i></div><div class="hint" style="margin:6px 0 0;text-align:center">${Math.round(all/100/goal*100)}% de ${eur(goal)}</div></div>`:''}
  <div class="grid2"><div class="card"><h3>FORMA DE COBRO</h3><table><tbody>${pays.map(([k,v])=>`<tr><td>${esc(k==='efectivo'?'Efectivo':k==='tarjeta'?'Tarjeta':k)}</td><td>${v.n} ped</td><td style="text-align:right;font-weight:700">${e(v.c)}</td></tr>`).join('')||'<tr><td class="tag">Sin datos</td></tr>'}</tbody></table></div>
  <div class="card"><h3>POR CAMARERO</h3><table><tbody>${wts.sort((a,b)=>b[1].c-a[1].c).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.n} ped</td><td style="text-align:right;font-weight:700">${e(v.c)}</td></tr>`).join('')||'<tr><td class="tag">Sin datos</td></tr>'}</tbody></table></div></div>
  <div class="card"><h3>LO MÁS VENDIDO</h3>${prods.map(([n,v])=>`<div class="pbar"><span>${esc(n)}</span><i style="width:${Math.max(2,v.c/pmax*100)}%"></i><b>${v.q} · ${e(v.c)}</b></div>`).join('')||'<p class="hint">Sin datos</p>'}</div>
  <div class="card"><h3>VENTAS POR HORA</h3><div class="hist">${hs<0?'<p class="hint">Sin datos</p>':hrs.slice(hs,he+1).map((v,i)=>`<div><i style="height:${Math.max(2,v/hmax*100)}%"></i><small>${(hs+i)%24}h</small><em>${v?Math.round(v/100):''}</em></div>`).join('')}</div></div>
  <div class="card"><h3>ARQUEOS DE EFECTIVO</h3>${arq.length?`<table><thead><tr><th>CAMARERO</th><th>HORA</th><th>DEBÍA</th><th>CONTADO</th><th></th></tr></thead><tbody>${arqRows}</tbody></table>`:'<p class="hint">Aún no hay arqueos.</p>'}</div>
  <p class="hint">${voids} pedidos anulados no cuentan.</p>
  <div style="margin-top:24px"><button class="btn red sm" id="wipe">Borrar datos de la noche (pedidos y arqueos)</button></div>`;
  $('#rf').onclick=()=>draw();
  $('#csv').onclick=()=>{let t='\ufeffFecha;Camarero;Pedido;Mesa;Productos;Total;Donativo;Cobro;Estado\n';os.forEach(o=>{t+=`${new Date(Number(o.ts)).toLocaleString('es-ES')};"${o.waiter}";${o.num||''};"${o.table_ref||''}";"${(o.items||[]).map(i=>i.q+'x '+i.n+(i.x?' ('+i.x+')':'')).join(', ').replace(/"/g,'""')}";${Number(o.total).toFixed(2).replace('.',',')};${Number(o.don||0).toFixed(2).replace('.',',')};${o.pay||''};${o.st}\n`});const b=new Blob([t],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='ventas-solera.csv';document.body.append(l);l.click();l.remove()};
  $('#wipe').onclick=async()=>{if(prompt('Esto borra TODOS los pedidos y arqueos guardados en la nube. Escribe BORRAR para confirmar')!=='BORRAR')return;try{await api('/rest/v1/orders?id=neq.',{method:'DELETE',headers:{Prefer:'return=minimal'}});await api('/rest/v1/cash_counts?id=neq.',{method:'DELETE',headers:{Prefer:'return=minimal'}});toast('Datos borrados');draw()}catch(x){toast(x.message,'bad')}};
  clearInterval(salesT);salesT=setInterval(()=>{if(tab==='ventas'&&document.visibilityState==='visible'&&!document.activeElement.closest('#view button:active'))draw()},30000);
}

/* ---------- cocina / barra ---------- */
function drawKitchen(){
  $('#view').innerHTML=`<h2>Cocina y barra</h2><p class="hint">Las comandas viajan entre barra y cocina por la red Wi-Fi local, sin pasar por internet. Por eso la cocina se ve <b>en el dispositivo donde esté abierta</b>. Desde aquí puedes abrir cualquiera de los dos modos en este mismo dispositivo (tu sesión de administrador ya vale).</p>
  <div class="card" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn pri" style="display:inline-flex;align-items:center" href="/#cocina" onclick="try{localStorage.setItem('zmb.role','cocina')}catch(e){}">Abrir modo COCINA</a><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none;color:inherit" href="/#barra" onclick="try{localStorage.setItem('zmb.role','barra')}catch(e){}">Abrir modo BARRA</a></div>`;
}

if(S&&S.role==='admin')showApp();else showLogin(S&&S.role!=='admin'?'Inicia sesión con la cuenta de administrador.':'');
})();
</script>
